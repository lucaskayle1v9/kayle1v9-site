:root{--bg:#12171c;--bg2:#1a2128;--panel:#222c33;--line:#080b0e;--ink:#f3ecd9;--muted:#9fb1b6;--gold:#f2b33d;--gold-lo:#a8691b;--warn:#e2575a;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:32px 32px;color:var(--ink);font-family:"KPixel","Courier New",monospace;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.lock{width:min(460px,100%);background:linear-gradient(#2c3a44,#1a2229);border:3px solid var(--line);box-shadow:inset 3px 3px 0 #44565f,inset -3px -3px 0 #0f151b,0 6px 0 rgba(0,0,0,.5);padding:26px 24px 22px;display:flex;flex-direction:column;gap:14px}
.head{display:flex;align-items:center;gap:14px}
.head img{width:64px;height:64px;image-rendering:pixelated;flex:none;filter:drop-shadow(3px 3px 0 rgba(0,0,0,.5))}
h1{margin:0;font-size:34px;line-height:1;color:var(--gold);text-shadow:3px 3px 0 #0b0810}
.tag{margin:4px 0 0;color:var(--muted);font-size:15px;line-height:1.35}
.line{height:3px;background:var(--line);box-shadow:0 1px 0 #44565f}
p{margin:0;color:var(--ink);font-size:17px;line-height:1.45}
label{font-size:12px;letter-spacing:.1em;color:var(--muted)}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;font:inherit;font-size:24px;letter-spacing:.25em;background:#0f151b;color:var(--ink);border:3px solid var(--line);box-shadow:inset 2px 2px 0 rgba(0,0,0,.6);padding:9px 12px}
input:focus-visible,button:focus-visible{outline:3px dashed var(--gold);outline-offset:2px}
button{font:inherit;font-weight:700;font-size:19px;background:var(--gold);color:#2a160c;border:3px solid var(--line);box-shadow:inset -3px -3px 0 var(--gold-lo),inset 2px 2px 0 #ffd27a;padding:9px 18px;cursor:pointer;text-shadow:1px 1px 0 #ffe9b0}
button:active{box-shadow:inset 3px 3px 0 var(--gold-lo)}
button:disabled{opacity:.6;cursor:wait}
.err{color:var(--warn);min-height:1.4em;font-size:16px}
.foot{color:var(--muted);font-size:13px;line-height:1.5}
.foot b{color:var(--ink);font-weight:400}
</style>

const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw){
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b(D.salt), iterations:D.iter, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['decrypt']);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM', iv:b(D.iv)}, key, b(D.ct)));
}
function start(html){ document.open(); document.write(html); document.close(); }
const EN = !/^de/i.test(navigator.language || '');
let saved = null; try { saved = JSON.parse(localStorage.getItem('kistenknacker-alm-v1') || 'null'); } catch (_) {}
const en = saved && saved.lang ? saved.lang === 'en' : EN;
if (en){ document.documentElement.lang = 'en'; document.title = 'Private'; document.getElementById('msg').textContent = 'This game is private. Enter the password and start cracking.'; document.getElementById('tag').textContent = 'A summer in the Alps: crack crates, fence the loot, sleep, repeat.'; document.getElementById('foot').innerHTML = '<b>PC:</b> A/D walk, E action, Space dodge · <b>Phone:</b> buttons below the game, hold it sideways · <b>Controller</b> is detected'; document.getElementById('lbl').textContent = 'PASSWORD'; document.getElementById('go').textContent = 'Play'; }
const f = document.getElementById('f'), err = document.getElementById('err'), go = document.getElementById('go');
f.addEventListener('submit', async e => {
  e.preventDefault(); err.textContent = ''; go.disabled = true;
  const pw = document.getElementById('pw').value;
  try { const html = await unlock(pw); try { sessionStorage.setItem('kk-pw', pw); } catch (_) {} start(html); }
  catch (_) { err.textContent = en ? 'Wrong password. Try again.' : 'Falsches Passwort. Versuch es nochmal.'; go.disabled = false; document.getElementById('pw').select(); }
});
(async () => { let pw = null; try { pw = sessionStorage.getItem('kk-pw'); } catch (_) {} if (pw){ try { start(await unlock(pw)); } catch (_) {} } })();
</script>
