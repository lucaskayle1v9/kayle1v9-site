<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>Privat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Silkscreen&display=swap">
<style>
:root{--bg:#12171c;--panel:#222c33;--line:#080b0e;--ink:#f3ecd9;--muted:#9fb1b6;--gold:#f2b33d;--gold-lo:#a8691b;--warn:#e2575a;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pixelify Sans","Courier New",monospace;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.lock{width:min(420px,100%);background:var(--panel);border:4px solid var(--line);box-shadow:0 8px 0 var(--line);padding:28px 24px;display:flex;flex-direction:column;gap:16px}
h1{margin:0;font-size:34px;color:var(--gold);text-shadow:3px 3px 0 #4a2c16}
p{margin:0;color:var(--muted);font-size:17px;line-height:1.4}
label{font-family:Silkscreen,"Courier New",monospace;font-size:12px;letter-spacing:.08em;color:var(--muted)}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;font:inherit;font-size:22px;letter-spacing:.2em;background:#1a2128;color:var(--ink);border:3px solid var(--line);padding:10px 12px}
input:focus-visible,button:focus-visible{outline:3px dashed var(--gold);outline-offset:2px}
button{font:inherit;font-weight:700;font-size:19px;background:var(--gold);color:#2a160c;border:3px solid var(--line);box-shadow:inset -3px -3px 0 var(--gold-lo);padding:10px 16px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.err{color:var(--warn);min-height:1.4em;font-size:16px}
</style>
</head>
<body>
<main class="lock">
  <h1>Kistenknacker</h1>
  <p id="msg">Dieses Spiel ist privat. Gib das Passwort ein, um zu spielen.</p>
  <form id="f" autocomplete="off">
    <label for="pw" id="lbl">PASSWORT</label>
    <div class="row"><input id="pw" type="password" inputmode="numeric" autofocus required><button id="go" type="submit">Spielen</button></div>
  </form>
  <p class="err" id="err" role="alert"></p>
</main>

const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw){
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b(D.salt), iterations:D.iter, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['decrypt']);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM', iv:b(D.iv)}, key, b(D.ct)));
}
function start(html){ document.open(); document.write(html); document.close(); }
const EN = !/^de/i.test(navigator.language || '');
let saved = null; try { saved = JSON.parse(localStorage.getItem('kistenknacker-alm-v1') || 'null'); } catch (_) {}
const en = saved && saved.lang ? saved.lang === 'en' : EN;
if (en){ document.documentElement.lang = 'en'; document.title = 'Private'; document.getElementById('msg').textContent = 'This game is private. Enter the password to play.'; document.getElementById('lbl').textContent = 'PASSWORD'; document.getElementById('go').textContent = 'Play'; }
const f = document.getElementById('f'), err = document.getElementById('err'), go = document.getElementById('go');
f.addEventListener('submit', async e => {
  e.preventDefault(); err.textContent = ''; go.disabled = true;
  const pw = document.getElementById('pw').value;
  try { const html = await unlock(pw); try { sessionStorage.setItem('kk-pw', pw); } catch (_) {} start(html); }
  catch (_) { err.textContent = en ? 'Wrong password. Try again.' : 'Falsches Passwort. Versuch es nochmal.'; go.disabled = false; document.getElementById('pw').select(); }
});
(async () => { let pw = null; try { pw = sessionStorage.getItem('kk-pw'); } catch (_) {} if (pw){ try { start(await unlock(pw)); } catch (_) {} } })();
