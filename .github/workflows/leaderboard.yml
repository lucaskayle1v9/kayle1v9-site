name: Update leaderboard
on:
  schedule:
    - cron: "40 2 * * *"   # every night, 04:40 Berlin summer time
  workflow_dispatch: {}      # lets you start it by hand from the Actions tab
permissions:
  contents: write
concurrency:
  group: leaderboard
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect data from the Riot API
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
        run: python tools/collect_leaderboard.py
      - name: Commit result
        run: |
          git config user.name "leaderboard-bot"
          git config user.email "leaderboard-bot@users.noreply.github.com"
          git add leaderboard.json data/lb_history.json
          git diff --cached --quiet || (git commit -m "Update leaderboard" && git pull --rebase -q && git push)
